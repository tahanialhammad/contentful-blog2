<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="petal-grad-2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f5a3a3" />
      <stop offset="50%" stop-color="#cf7a7a" />
      <stop offset="100%" stop-color="#763d3d" />
    </linearGradient>
    <linearGradient id="petal-curl-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e8a2a2" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#6a3738" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Main Petal Body -->
  <path d="M45,15 C65,18 78,40 72,62 C67,78 50,88 45,88 C40,88 28,78 28,62 C28,40 32,18 45,15 Z" fill="url(#petal-grad-2)" filter="url(#shadow)" />
  <!-- Curled Edge Overlay for 3D effect -->
  <path d="M45,15 C52,16 65,25 60,40 C57,48 50,52 45,55 C48,45 50,30 45,15 Z" fill="url(#petal-curl-2)" />
</svg>
